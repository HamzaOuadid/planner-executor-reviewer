name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run the full test suite (planner/executor/reviewer loop, driven entirely by the fake LLM client)
        run: pytest tests/ -v

      - name: Run the reviewer vs. no-reviewer success-rate comparison (M4 proof metric)
        run: peer-loop eval

      - name: Run the flagship multi-round demo (reviewer catches and corrects a real bad plan)
        run: peer-loop demo
